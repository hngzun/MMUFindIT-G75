<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Missing Item - MMU Lost & Found</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #004080;
      color: white;
      text-align: center;
      padding: 20px;
    }
    main {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #004080;
    }
    form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    form input, form textarea, form select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    form button {
      margin-top: 20px;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    form button:hover {
      background-color: #004080;
    }
    footer {
      text-align: center;
      background-color: #004080;
      color: white;
      padding: 10px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

    <header>
      <h1>MMUFindit Lost & Found</h1>
      <img src="mmu_logo.png" alt="MMU Logo" style="height:60px; vertical-align:middle; margin-right:15px;">
      <h1 style="display:inline-block; vertical-align:middle;"></h1>
      <p>Report Your Missing Item</p>
    </header>

  <main>
    <h2>Missing Item Form</h2>
  
    <form action="submit_missing_item.php" method="POST" enctype="multipart/form-data">
      <label for="itemName">Item Name</label>
      <input type="text" id="itemName" name="itemName" placeholder="e.g., Wallet, Laptop, ID Card" required>

      <label for="itemDescription">Description</label>
      <textarea id="itemDescription" name="itemDescription" rows="4" placeholder="Color, brand, unique features..." required></textarea>

      <label for="location">Last Seen Location</label>
      <input type="text" id="location" name="location" placeholder="e.g., Library, Cafeteria, Lecture Hall" required>

      <label for="dateLost">Date Lost</label>
      <input type="date" id="dateLost" name="dateLost" required>

      <label for="contact">Your Contact (Email/Phone)</label>
      <input type="text" id="contact" name="contact" placeholder="e.g., arief@mmu.edu.my" required>

      <label for="itemPhoto">Upload Item Photo</label>
      <input type="file" id="itemPhoto" name="itemPhoto" accept="image/*">

      <button type="submit">Submit Report</button>
    </form>
    <p style="margin-top:20px; text-align:center;"><a href="ListPage_FCI.html">View Reports</a> | <a href="report found page.html">Report Found Item</a></p>
  </main>

  <footer>
    <p>&copy; 2026 MMU Cyberjaya Lost & Found</p>
  </footer>
</body>
</html>
