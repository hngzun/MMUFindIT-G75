
<!DOCTYPE html>
<html lang="en">
     <title>MMUFindIT</title>
    <style>
body {
    background-color: #c4bebe;
    font-family: 'Times New Roman', Times, serif;
    margin: 0;
    padding: 20px;
    background-image: url("MMUFIT.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
    background-attachment: fixed;
    text-align: center;
}
.box-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 480px;
    margin: 40px 20px 40px auto;
}


.name-box {
    background: transparent;
    border: 1px solid #999;
    border-radius: 12px;
    padding: 16px;
    min-height: 150px;
}
.name-box h1 {
    margin: 0 0 10px;
    font-size: 18px;
}

.name-list {
    column-count: 1;
    column-gap: 14px;
}

.name-list div {
    break-inside: avoid;
    padding: 3px 0;
}
 h2 {
   text-align: center;
    text-shadow: 2px 2px 4px rgba(34, 13, 13, 0.5); font-size: 50px;
    margin: 20px 20px 0 0;
     color: #333; font-size: 30px;
 }
 h3 {
    text-align: center;
    text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
    font-size: 15px;
    margin: 0 20px 20px 0;
    color: #370101;
}
.name-box h1 a {
    color: #333;
    text-decoration: none;
}
.name-box h1 a:hover {
    text-decoration: underline;
}
.name-box.area-1 {
    background-color: rgba(255, 0, 0, 0.3);
}


    </style>
