
<!DOCTYPE html>
<html lang="en">
<head>
    <title>MMUFindIT</title>
    <meta charset="UTF-8">
    <style>
body {
    background-color: #c4bebe;
    font-family: 'Times New Roman', Times, serif;
    margin: 0;
    padding: 0;
    background-image: url("MMUFIT.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
    background-attachment: fixed;
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
header {
    background-color: #4a5057;
    color: white;
    text-align: center;
    padding: 5px;
}
h4 {
    margin: 0;
    font-size: 19px;
}   
.content {
    flex: 1;
    padding: 20px;
}
.box-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px;
    max-width: 680px;
    margin: 40px 20px 40px 200px; 
}
.name-box {
    background: transparent;
    border: 1px solid #999;
    border-radius: 12px;
    padding: 18px;
    min-height: 425px;
}
.name-box h1 {
    margin: 0 0 10px;
    font-size: 18px;
}
footer {
    text-align: center;
    background-color: #4a5057;
    color: white;
    padding: 5px;
    margin-top: auto;
}

      .report-entry {
        background: rgba(255,255,255,0.8);
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
        text-align: left;
      }
      .report-date {
        font-size: 0.9em;
        color: #555;
      }
    </style>
</head>
<body>
    <header>
    
        <img src="mmu_logo.png" alt="MMU Logo" style="height:60px; vertical-align:middle; margin-right:15px;">
       <h1 style="display:inline-block; vertical-align:middle;"></h1>
        <h4>MMUFindit Lost & Found</h4>
        
    </header>
    <div class="content">
        <div class="box-grid">
            <div class="name-box">
                <h1>Area 1</h1>
                <div id="area1List" class="name-list">
                    <div>No reports yet.</div>
                </div>
            </div>
            <div class="name-box">
                <h1>Area 2</h1>
                <div id="area2List" class="name-list">
                    <div>No reports yet.</div>
                </div>
            </div>
        </div>
    </div>
    <script>
      function formatReport(report) {
        return `<div class="report-entry">
                  <strong>${report.itemName}</strong> <span class="report-date">(${report.dateLost})</span><br>
                  <em>${report.location}</em><br>
                  <span>${report.itemDescription}</span>
                </div>`;
      }

      async function renderReports() {
        const area1 = document.getElementById('area1List');
        const area2 = document.getElementById('area2List');

        area1.innerHTML = '';
        area2.innerHTML = '';

        try {
          const response = await fetch('get_reports.php');
          if (!response.ok) {
            throw new Error('Unable to load reports from the server.');
          }

          const reports = await response.json();
          if (!Array.isArray(reports) || reports.length === 0) {
            area1.innerHTML = '<div>No reports yet.</div>';
            area2.innerHTML = '<div>No reports yet.</div>';
            return;
          }

          reports.forEach(report => {
            const text = `${report.location}`.toLowerCase();
            const isArea1 = /fci|dtc|fom/.test(text);
            const target = isArea1 ? area1 : area2;
            target.insertAdjacentHTML('beforeend', formatReport(report));
          });
        } catch (error) {
          const errorMessage = `<div class="error">Error loading reports: ${error.message}</div>`;
          area1.innerHTML = errorMessage;
          area2.innerHTML = errorMessage;
        }
      }

      window.addEventListener('DOMContentLoaded', renderReports);
    </script>
    
    <footer>
        <p>&copy; 2026 MMU Cyberjaya Lost & Found</p>
    </footer>
</body>
</html>
