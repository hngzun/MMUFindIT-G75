
<!DOCTYPE html>
<html lang="en">
<head>
    <title>MMUFindIT</title>
    <meta charset="UTF-8">
    <style>
body {
    background-color: #c4bebe;
    font-family: 'Times New Roman', Times, serif;
    margin: 0;
    padding: 0;
    background-image: url("MMUFIT.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
    background-attachment: fixed;
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
header {
    background-color: #4a5057;
    color: white;
    text-align: center;
    padding: 5px;
}
h4 {
    margin: 0;
    font-size: 19px;
}   
.content {
    flex: 1;
    padding: 20px;
}
.box-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px;
    max-width: 680px;
    margin: 40px 20px 40px 200px; 
}
.name-box {
    background: transparent;
    border: 1px solid #999;
    border-radius: 12px;
    padding: 18px;
    min-height: 425px;
}
.name-box h1 {
    margin: 0 0 10px;
    font-size: 18px;
}
footer {
    text-align: center;
    background-color: #4a5057;
    color: white;
    padding: 5px;
    margin-top: auto;
}
    </style>
</head>
<body>
    <header>
    
        <img src="mmu_logo.png" alt="MMU Logo" style="height:60px; vertical-align:middle; margin-right:15px;">
       <h1 style="display:inline-block; vertical-align:middle;"></h1>
        <h4>MMUFindit Lost & Found</h4>
        
    </header>
    <div class="content">
        <div class="box-grid">
            <div class="name-box">
                <h1>Area 1</h1>
                <div class="name-list">
                    <div>DTC</div>
                    <div>FCI</div>
                    <div>FOM</div>
                </div>
            </div>
            <div class="name-box">
                <h1>Area 2</h1>
                <div class="name-list">
                    <div>Another</div>
                    <div>Place</div>
                    <div>Here</div>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2026 MMU Cyberjaya Lost & Found</p>
    </footer>
</body>
</html>
